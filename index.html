<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gunsmith • Discord Order Calculator</title>
<style>
:root{color-scheme:dark;--bg:#121312;--panel:#20221f;--edge:#3b4039;--ink:#f5f1e8;--muted:#b4b6aa;--gold:#eac079;--green:#92c79c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#28291f,#121312 65%);font:15px system-ui,Segoe UI,sans-serif;color:var(--ink)}.shell{max-width:1100px;margin:30px auto;padding:0 16px}header{margin-bottom:22px}h1{font-size:28px;margin:0 0 5px;letter-spacing:.5px}header p{margin:0;color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}.panel{background:var(--panel);border:1px solid var(--edge);border-radius:14px;overflow:hidden}.toolbar{padding:15px;border-bottom:1px solid var(--edge)}input[type=search],input[type=text]{width:100%;border:1px solid #555b51;background:#151715;border-radius:8px;color:white;padding:11px;font:inherit;outline-color:var(--gold)}.group{padding:2px 15px 12px}.group h2{font-size:14px;color:var(--gold);margin:17px 0 9px;border-bottom:1px solid var(--edge);padding-bottom:8px}.item{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #343831}.item:last-child{border:0}.name{font-weight:600}.price{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}.step{display:flex;gap:5px;align-items:center}.step button{width:30px;height:30px;border:1px solid #636a5e;border-radius:7px;background:#30352e;color:white;font-size:18px;cursor:pointer}.step button:hover{background:#4b5147}.count{min-width:22px;text-align:center;font-variant-numeric:tabular-nums}.receipt{position:sticky;top:16px;padding:17px}.receipt h2{margin:0 0 12px;font-size:20px}.field-label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}.summary{margin-top:16px;border-top:1px solid var(--edge);padding-top:12px;min-height:70px}.line{display:flex;justify-content:space-between;gap:7px;margin:8px 0;font-size:13px}.line span:first-child{flex:1}.line strong{white-space:nowrap}.empty{color:var(--muted);font-size:13px}.total{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:22px;border-top:1px solid var(--edge);margin-top:15px;padding-top:15px}.total strong{color:var(--gold)}.buttons{display:grid;gap:9px;margin-top:18px}button.action{border:0;border-radius:9px;padding:12px;font:inherit;font-weight:750;cursor:pointer;background:var(--gold);color:#242017}button.action.secondary{background:#363b34;color:#fff;border:1px solid #5b6257}button.action:hover{filter:brightness(1.1)}.note{font-size:12px;line-height:1.5;color:var(--muted);margin:13px 0 0}#status{min-height:18px;color:var(--green);font-size:12px;margin-top:10px}#noMatches{padding:18px;color:var(--muted);display:none}@media(max-width:800px){.layout{grid-template-columns:1fr}.receipt{position:static;order:-1}.shell{margin-top:20px}.item{gap:5px}.name{font-size:13px}}@media(max-width:370px){.item{grid-template-columns:minmax(0,1fr) auto}.price{grid-column:1;grid-row:2}.step{grid-column:2;grid-row:1/span 2}}
</style>
</head>
<body><div class="shell"><header><h1>⚒️ Gunsmith Order Calculator</h1><p>Select weapons and ammunition, then copy the order into Discord.</p></header>
<div class="layout"><main class="panel"><div class="toolbar"><input type="search" id="search" placeholder="Search weapons or ammo…" aria-label="Search catalogue"></div><div id="catalog"></div><div id="noMatches">No matching items.</div></main>
<aside class="panel receipt"><h2>Order Ticket</h2><label class="field-label" for="customer">Customer / buyer (optional)</label><input id="customer" type="text" maxlength="80" placeholder="Customer name"><div class="summary" id="summary"><div class="empty">No items selected yet.</div></div><div class="total"><span>Total</span><strong id="total">$0</strong></div><div class="buttons"><button class="action" id="copy">📋 Copy for Discord</button><button class="action secondary" id="clear">Clear order</button></div><div id="status" aria-live="polite"></div><p class="note">The copied ticket uses Discord-friendly text formatting. Prices are per item; ammunition prices are per unit selected.</p></aside></div></div>
<script>
const DATA={
'Pistols':[['Semi-Auto Pistol',345],['Mauser Pistol',345],['M1899 Pistol',395],['Volcanic Pistol',295]],
'Revolvers':[['LeMat Revolver',245],['Navy Revolver',245],['Schofield Revolver',245],['Double Action Revolver',220],['Cattleman Revolver',25],['High Roller Revolver',345],['Navy Crossover Revolver',255],['Cattleman Mexican Revolver',145]],
'Rifles':[['Bolt-Action Rifle',295],['Springfield Rifle',180],['Varmint Rifle',35],['Elephant Rifle',330]],
'Repeaters':[['Winchester Repeater',295],['Carbine Repeater',40],['Evans Repeater',345],['Henry Repeater',295]],
'Shotguns':[['Semi-Auto Shotgun',370],['Double Barrel Shotgun',295],['Pump Shotgun',440],['Double Barrel Exotic Shotgun',35],['Repeating Shotgun',420]],
'Bows':[['Bow',18],['Improved Bow',50]],
'Ammunition':[['Express',10],['Split Point',8],['Velocity',8],['Normal',6],['Shotgun Normal',7],['Shotgun Slug',10],['Elephant Rifle Ammo',12]]
};
const items=Object.entries(DATA).flatMap(([category,rows])=>rows.map(([name,price])=>({category,name,price,qty:0})));
const fmt=n=>'$'+n.toLocaleString('en-US');
const catalog=document.querySelector('#catalog'),summary=document.querySelector('#summary'),total=document.querySelector('#total'),status=document.querySelector('#status');
function renderCatalog(){const q=document.querySelector('#search').value.trim().toLowerCase();catalog.innerHTML='';let shown=0;for(const [category] of Object.entries(DATA)){const matches=items.map((it,i)=>({...it,i})).filter(it=>it.category===category&&(it.name.toLowerCase().includes(q)||category.toLowerCase().includes(q)));if(!matches.length)continue;shown+=matches.length;const section=document.createElement('section');section.className='group';const heading=document.createElement('h2');heading.textContent=category;section.append(heading);for(const it of matches){const div=document.createElement('div');div.className='item';const name=document.createElement('span');name.className='name';name.textContent=it.name;const price=document.createElement('span');price.className='price';price.textContent=fmt(it.price);const step=document.createElement('span');step.className='step';const minus=document.createElement('button');minus.type='button';minus.textContent='−';minus.setAttribute('aria-label','Remove one '+it.name);minus.onclick=()=>changeQty(it.i,-1);const count=document.createElement('span');count.className='count';count.textContent=it.qty;const plus=document.createElement('button');plus.type='button';plus.textContent='+';plus.setAttribute('aria-label','Add one '+it.name);plus.onclick=()=>changeQty(it.i,1);step.append(minus,count,plus);div.append(name,price,step);section.append(div)}catalog.append(section)}document.querySelector('#noMatches').style.display=shown?'none':'block'}
function changeQty(i,d){items[i].qty=Math.min(999,Math.max(0,items[i].qty+d));status.textContent='';renderCatalog();renderSummary()}
function selected(){return items.filter(it=>it.qty>0)}
function renderSummary(){summary.innerHTML='';const chosen=selected();if(!chosen.length){summary.innerHTML='<div class="empty">No items selected yet.</div>'}for(const it of chosen){const row=document.createElement('div');row.className='line';const name=document.createElement('span');name.textContent=it.qty+' × '+it.name;const sum=document.createElement('strong');sum.textContent=fmt(it.qty*it.price);row.append(name,sum);summary.append(row)}total.textContent=fmt(chosen.reduce((s,it)=>s+it.qty*it.price,0))}
function ticket(){const chosen=selected();const customer=document.querySelector('#customer').value.trim();const lines=['**⚒️ GUNSMITH ORDER**'];if(customer)lines.push('**Customer:** '+customer.replace(/[\r\n]/g,' '));lines.push('');let last='';for(const it of chosen){if(it.category!==last){last=it.category;lines.push('**'+last+'**')}lines.push('• '+it.qty+'x '+it.name+' — '+fmt(it.qty*it.price))}lines.push('','**TOTAL: '+fmt(chosen.reduce((s,it)=>s+it.qty*it.price,0))+'**');return lines.join('\n')}
document.querySelector('#copy').onclick=async()=>{if(!selected().length){status.textContent='Add an item first.';return}const output=ticket();try{await navigator.clipboard.writeText(output);status.textContent='✓ Copied! Paste into Discord.'}catch{const ta=document.createElement('textarea');ta.value=output;ta.style.position='fixed';ta.style.opacity='0';document.body.append(ta);ta.select();const ok=document.execCommand('copy');ta.remove();status.textContent=ok?'✓ Copied! Paste into Discord.':'Clipboard blocked — try a modern browser or HTTPS.'}};
document.querySelector('#clear').onclick=()=>{items.forEach(it=>it.qty=0);document.querySelector('#customer').value='';status.textContent='Order cleared.';renderCatalog();renderSummary()};document.querySelector('#search').addEventListener('input',renderCatalog);renderCatalog();renderSummary();
</script></body></html>
